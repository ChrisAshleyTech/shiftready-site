<!-- 3D door R for the landing intro video. Rendered frame by frame by render-door.mjs; the shapes
     (door-r.svg, door-step.svg) are traced from brand-source/rolevara-mark.png, Christopher's logo artwork. -->
<!doctype html><html><body style="margin:0;background:#000">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = +new URLSearchParams(location.search).get("w") || 1280, H = Math.round(W * 9 / 16);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#04112a"); scene.fog = new THREE.Fog("#04112a", 14, 40);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.15;

const S = 0.01, CX = 632, BOTTOM = 965, DEPTH = 0.9;
async function extrude(url, material, depth) {
  const data = new SVGLoader().parse(await (await fetch(url)).text());
  const shapes = data.paths.flatMap(p => SVGLoader.createShapes(p));
  const geo = new THREE.ExtrudeGeometry(shapes, { depth, bevelEnabled: true, bevelThickness: 0.06 / S, bevelSize: 0.04 / S, bevelSegments: 4, curveSegments: 24 });
  geo.scale(S, -S, S); geo.translate(-CX * S, BOTTOM * S, 0);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, material); m.castShadow = true; m.receiveShadow = true; return m;
}
const white = new THREE.MeshPhysicalMaterial({ color: "#dfe6f0", roughness: 0.38, metalness: 0.1, clearcoat: 0.35, clearcoatRoughness: 0.3 });
const teal = new THREE.MeshPhysicalMaterial({ color: "#00ADA8", emissive: "#00ADA8", emissiveIntensity: 0.55, roughness: 0.3 });
const R = await extrude("door-r.svg", white, DEPTH / S);
const step = await extrude("door-step.svg", teal, DEPTH / S);
const logo = new THREE.Group(); logo.add(R, step); logo.position.z = -DEPTH / 2; scene.add(logo);

// Warm office light seen through the door opening.
const glowMat = new THREE.MeshBasicMaterial({ color: new THREE.Color("#ffe2a8").multiplyScalar(1.6) });
const glow = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 5.2), glowMat); glow.position.set(-0.77, 3.4, -1.6); scene.add(glow);
const warm = new THREE.PointLight("#ffd58a", 12, 10, 2); warm.position.set(-0.77, 3.0, -2.2); scene.add(warm);
const spill = new THREE.SpotLight("#ffd58a", 45, 16, 0.5, 0.6, 1.6); spill.position.set(-0.77, 4, -3); spill.target.position.set(-0.77, 0, 5); spill.castShadow = true; scene.add(spill, spill.target);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: "#0a1a38", roughness: 0.35, metalness: 0.4 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight("#cfe3ff", 1.2); key.position.set(-6, 9, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
const rim = new THREE.DirectionalLight("#5BB4E8", 1.4); rim.position.set(7, 5, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight("#284a80", "#020814", 0.6));
const fill = new THREE.DirectionalLight("#ffffff", 0.9); fill.position.set(1, 3, 12); scene.add(fill);

const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 100);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.5, 0.92));
composer.addPass(new OutputPass());

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const DOOR = new THREE.Vector3(-0.77, 3.2, 0);
// t in [0,1]: arc from a low wide angle on the left, settle face-on, then push through the doorway.
window.renderAt = t => {
  const a = ease(Math.min(1, t / 0.62)), b = ease(Math.max(0, (t - 0.62) / 0.38));
  const ang = lerp(-0.7, 0, a), dist = lerp(26, 17, a);
  const p = new THREE.Vector3(Math.sin(ang) * dist + DOOR.x * a, lerp(1.4, 3.0, a), Math.cos(ang) * dist);
  p.lerp(new THREE.Vector3(DOOR.x, 3.1, -1.2), b);
  camera.position.copy(p);
  const look = new THREE.Vector3(lerp(0.2, DOOR.x, a), lerp(3.2, 3.1, a), 0).lerp(new THREE.Vector3(DOOR.x, 3.1, -3), b);
  camera.lookAt(look); camera.fov = lerp(34, 32, a) ; camera.updateProjectionMatrix();
  renderer.toneMappingExposure = 0.9 + 6 * Math.pow(b, 4);
  composer.render();
};
window.ready = true;
</script></body></html>
