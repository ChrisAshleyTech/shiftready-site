<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Seed demo state</title></head>
<body>
<p>Seeding a demo week, then opening the app… Use <code>?s=mon</code> (Monday half done) or <code>?s=thu</code> (Thursday in progress) and <code>&amp;to=%23/queue</code>.</p>
<script type="module">
// Builds a realistic partly played week in localStorage for screenshots and manual QA.
import { S, setState } from "../assets/js/engine/store.js";
import { T, TK } from "../assets/js/engine/tickets.js";
import { startThursday, THU_T } from "../assets/js/engine/thursday.js";
import * as st from "../assets/js/engine/state.js";
const q = new URLSearchParams(location.search), mode = q.get("s") || "thu";
setState(st.fresh());
const close = (id, kind = "resolve", answer) => { st.tact("start", id); return st.closeTicket(id, kind, { note: "", answer }); };
// A decent but imperfect Monday.
st.tact("start", "REQ0018841"); st.act("enable", "maria.lopez"); ["GRP-All-Staff","APP-M365-E3","APP-SAP-AP-Entry","APP-Concur-User"].forEach(g => st.act("addgrp", "maria.lopez", g)); st.closeTicket("REQ0018841", "resolve");
st.tact("start", "INC0041207"); st.revealHint("INC0041207"); st.tact("verify", "INC0041207"); st.act("pwreset", "james.carter"); st.closeTicket("INC0041207", "resolve");
st.tact("start", "INC0041220"); st.tact("escalate", "INC0041220", "Security team"); st.closeTicket("INC0041220", "reject");
st.tact("start", "REQ0018855"); st.revealHint("REQ0018855"); st.revealHint("REQ0018855"); st.revealHint("REQ0018855"); st.closeTicket("REQ0018855", "reject");
st.tact("start", "TSK0007712"); ["greg.foster","nina.shah"].forEach(u => st.act("disable", u)); st.act("disable", "svc-backup"); st.closeTicket("TSK0007712", "resolve");
st.tact("start", "REQ0018850"); st.act("disable", "robert.hayes"); st.closeTicket("REQ0018850", "resolve");
st.tact("start", "INC0041240"); st.act("revoke", "sam.okafor"); st.act("pwreset", "sam.okafor");
if (mode === "thu") {
  T.forEach(t => { if (!S.tickets[t.id].checks) close(t.id, TK[t.id].close, TK[t.id].question ? "derek.chan" : undefined); });
  startThursday();
  st.tact("start", "INC0041302"); st.revealHint("INC0041302"); const tg = TK.INC0041302.users[0]; ["disable","revoke","mfareset"].forEach(a => st.act(a, tg)); st.tact("escalate", "INC0041302", "Security team"); st.closeTicket("INC0041302", "resolve");
  st.tact("start", "INC0041305"); st.act("enable", "svc-backup"); st.closeTicket("INC0041305", "resolve");
  st.tact("start", "INC0041308");
}
st.save();
location.replace("/app/" + (q.get("to") || "#/home"));
</script>
</body>
</html>
