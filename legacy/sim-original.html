<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShiftReady Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --panel2:#F6F8FA; --ink:#15202B; --muted:#5B6875; --line:#D5DBE2;
  --accent:#0B6E6E; --accent-ink:#FFFFFF; --accent-soft:#DCEEED;
  --warn:#94600A; --warn-soft:#FBEFD6; --bad:#B42318; --bad-soft:#FBE3E0; --ok:#1E7A3C; --ok-soft:#DFF2E4;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 14px rgba(21,32,43,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --panel:#17202A; --panel2:#1C2733; --ink:#E4EAF0; --muted:#93A1AF; --line:#2B3744;
    --accent:#4FC1B8; --accent-ink:#0B1A1A; --accent-soft:#143533;
    --warn:#E3A63C; --warn-soft:#3A2C10; --bad:#F0776B; --bad-soft:#3D1B18; --ok:#5CC98A; --ok-soft:#173524;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --panel:#17202A; --panel2:#1C2733; --ink:#E4EAF0; --muted:#93A1AF; --line:#2B3744;
  --accent:#4FC1B8; --accent-ink:#0B1A1A; --accent-soft:#143533;
  --warn:#E3A63C; --warn-soft:#3A2C10; --bad:#F0776B; --bad-soft:#3D1B18; --ok:#5CC98A; --ok-soft:#173524;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:14px 90px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand .co{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{border:1px solid transparent;background:none;padding:7px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.tab .n{font-family:var(--mono);font-size:11px;margin-left:6px;color:var(--muted)}
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.split{grid-template-columns:380px 1fr}.split .back{display:none}}
@media (max-width:899px){.split.show-detail .list{display:none}.split:not(.show-detail) .detail{display:none}}
.list{display:flex;flex-direction:column;gap:6px;min-width:0}
.detail{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.row[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row .t{font-weight:600;line-height:1.3}
.row .s{font-size:12.5px;color:var(--muted)}
.pri{font-family:var(--mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;border:1px solid var(--line);min-width:28px;text-align:center}
.pri.p1{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pri.p2{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.d-body{padding:16px;display:flex;flex-direction:column;gap:16px}
.d-head{display:flex;flex-direction:column;gap:6px}
.d-head h2{font-size:21px;font-weight:600;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.body-text{max-width:68ch}
.body-text p{margin:0 0 8px}
.callout{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
.callout h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{align-self:flex-start;border:none;background:none;color:var(--accent);font-weight:600;padding:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.grp{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.grps{display:flex;flex-direction:column;gap:4px}
.x{border:none;background:none;color:var(--bad);font-size:12px;font-weight:600;padding:2px 4px}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters input{flex:1 1 180px}
.check{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:none}
.check .mk{font-weight:700;font-family:var(--mono)}
.check.pass .mk{color:var(--ok)} .check.fail .mk{color:var(--bad)}
.check .why{font-size:12.5px;color:var(--muted)}
.check .pts{font-family:var(--mono);font-size:12px;color:var(--muted)}
.scorebig{font-family:var(--mono);font-size:26px;font-weight:500}
.lesson{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--panel2)}
tr:last-child td{border-bottom:none}
.stack{display:flex;flex-direction:column;gap:14px}
.policy li{margin-bottom:6px}
.activebar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:10;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.activebar .lbl{font-size:12px;color:var(--muted)}
.activebar .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activebar > div{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.intro{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.intro p{margin:0;max-width:75ch}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.homelink{display:inline-block;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.trackset{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:12px;flex-wrap:wrap}
.trackset button{border:none;background:none;padding:6px 14px;border-radius:6px;font-weight:600;font-family:var(--cond);font-size:14px;color:var(--muted)}
.trackset button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.trackset button:disabled{cursor:default;opacity:.7}
.soon{font-family:var(--mono);font-size:10px;font-weight:400;text-transform:uppercase;letter-spacing:.06em}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.srow .t{font-weight:600}
.srow select{width:100%}
.q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:6px}
.q legend{font-weight:600;padding:0 4px}
.opt{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--panel2)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.viewtoggle{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.viewtoggle button{border:none;background:none;padding:5px 12px;border-radius:6px;font-weight:500;color:var(--muted)}
.viewtoggle button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.report{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.rline{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13px}
.rline .mk{font-family:var(--mono);font-weight:700}
.rline.bad .mk{color:var(--bad)} .rline.good .mk{color:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app"></div>
<div id="bar"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
// ---------- Company blueprint ----------
const ROLES = {
  "Executive|CEO":["GRP-All-Staff","APP-M365-E3","APP-Finance-Reports","APP-Concur-Approver"],
  "Finance|CFO":["GRP-All-Staff","APP-M365-E3","APP-Finance-Reports","APP-Concur-Approver"],
  "Finance|Controller":["GRP-All-Staff","APP-M365-E3","APP-SAP-GL-Post","APP-Finance-Reports","APP-Concur-Approver"],
  "Finance|AP Manager":["GRP-All-Staff","APP-M365-E3","APP-SAP-AP-Approve","APP-Concur-Approver","APP-Finance-Reports"],
  "Finance|AP Clerk":["GRP-All-Staff","APP-M365-E3","APP-SAP-AP-Entry","APP-Concur-User"],
  "Sales|Sales Manager":["GRP-All-Staff","APP-M365-E3","APP-Salesforce-User","APP-Salesforce-Reports","APP-Concur-Approver"],
  "Sales|Account Executive":["GRP-All-Staff","APP-M365-E3","APP-Salesforce-User"],
  "Operations|Operations Manager":["GRP-All-Staff","APP-M365-E3","APP-CargoWise-Ops","APP-WMS-User","APP-Concur-Approver"],
  "Operations|Warehouse Manager":["GRP-All-Staff","APP-M365-E3","APP-WMS-User","APP-WMS-Admin","APP-Concur-Approver"],
  "Operations|Dispatcher":["GRP-All-Staff","APP-M365-E3","APP-CargoWise-Ops","APP-WMS-User"],
  "Operations|Warehouse Associate":["GRP-All-Staff","APP-M365-F3","APP-WMS-User"],
  "Operations|Ops Contractor":["GRP-Contractors","APP-WMS-User"],
  "HR|HR Director":["GRP-All-Staff","APP-M365-E3","APP-Workday-HR","APP-Concur-Approver"],
  "HR|HR Generalist":["GRP-All-Staff","APP-M365-E3","APP-Workday-HR"],
  "IT|IT Manager":["GRP-All-Staff","APP-M365-E3","APP-ServiceNow-Agent","ROLE-User-Admin","APP-Concur-Approver"],
  "IT|Service Desk Tech":["GRP-All-Staff","APP-M365-E3","APP-ServiceNow-Agent","ROLE-Helpdesk-Admin"]
};
const REQUESTABLE = ["APP-Salesforce-Reports","APP-Finance-Reports"];
const SOD = [
  ["APP-SAP-AP-Entry","APP-SAP-AP-Approve","One person could enter and approve their own invoice."],
  ["APP-SAP-Vendor-Master","APP-SAP-AP-Approve","One person could create a fake vendor and approve payment to it."],
  ["APP-SAP-Vendor-Master","APP-SAP-AP-Entry","One person could create a vendor and invoice from it."]
];
const ALL_GROUPS = [...new Set([].concat(...Object.values(ROLES), ["ROLE-Global-Admin","APP-SAP-Vendor-Master","SVC-Backup-Operators"]))].sort();
const BASE = new Date(2026,9,5);
const fmtDay = off => { const d=new Date(BASE); d.setDate(d.getDate()+off); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };

function buildUsers(){
  const U={};
  const K=(id,name,empId,rk,mgr,x={})=>{
    const [dept,title]=rk?rk.split("|"):[x.dept,x.title];
    U[id]=Object.assign({id,name,empId,dept,title,mgr,type:"Employee",enabled:true,locked:false,mfa:true,
      groups:rk?ROLES[rk].slice():[],last:1,expiry:null,revoked:false,pwReset:false,mfaReset:false,preHire:false},x);
  };
  K("howard.lane","Howard Lane","10001","Executive|CEO","Board of Directors",{last:0});
  K("patricia.reed","Patricia Reed","10002","Finance|CFO","Howard Lane",{last:0});
  K("dana.whitfield","Dana Whitfield","10011","Finance|Controller","Patricia Reed");
  K("derek.chan","Derek Chan","10047","Finance|AP Manager","Dana Whitfield",{groups:ROLES["Finance|AP Manager"].concat("APP-SAP-AP-Entry")});
  K("linda.park","Linda Park","10105","Sales|Sales Manager","Howard Lane");
  K("kevin.nguyen","Kevin Nguyen","10244","Sales|Sales Manager","Linda Park");
  K("carla.jensen","Carla Jensen","10150","Operations|Operations Manager","Howard Lane");
  K("marcus.bell","Marcus Bell","10163","Operations|Warehouse Manager","Carla Jensen");
  K("angela.ruiz","Angela Ruiz","10180","HR|HR Director","Howard Lane");
  K("victor.alvarez","Victor Alvarez","10190","IT|IT Manager","Howard Lane");
  K("james.carter","James Carter","10231","Sales|Account Executive","Linda Park",{last:3});
  K("aisha.brown","Aisha Brown","10318","Operations|Dispatcher","Carla Jensen",{locked:true});
  K("robert.hayes","Robert Hayes","10322","Operations|Dispatcher","Carla Jensen",{last:0});
  K("tanya.wright","Tanya Wright","10257","Sales|Account Executive","Linda Park");
  K("lisa.morales","Lisa Morales","10291","Finance|AP Clerk","Derek Chan");
  K("omar.hassan","Omar Hassan","10266","Sales|Account Executive","Kevin Nguyen");
  K("dev.patel","Dev Patel","C-2051","Operations|Ops Contractor","Carla Jensen (sponsor)",{type:"Contractor",expiry:2});
  K("greg.foster","Greg Foster","10210","Sales|Account Executive","Linda Park",{last:112});
  K("nina.shah","Nina Shah","10330","Operations|Dispatcher","Carla Jensen",{last:97});
  K("paul.kim","Paul Kim","10288","Finance|AP Clerk","Derek Chan",{last:134});
  K("helen.cho","Helen Cho","10185","HR|HR Generalist","Angela Ruiz",{last:88});
  K("svc-backup","svc-backup","SVC-003",null,"Victor Alvarez (owner)",{dept:"IT",title:"Service account: nightly backups",type:"Service",groups:["SVC-Backup-Operators"],last:200,mfa:false});
  K("brian.walsh","Brian Walsh","10239","Sales|Account Executive","Linda Park",{last:2});
  K("tyler.brooks","Tyler Brooks","10197","IT|Service Desk Tech","Victor Alvarez");
  K("sofia.ramirez","Sofia Ramirez","10218","Sales|Account Executive","Linda Park",{enabled:false,groups:["GRP-All-Staff","APP-Salesforce-User"],last:412});
  K("jordan.lee","Jordan Lee","10295","Finance|AP Clerk","Derek Chan",{groups:ROLES["Finance|AP Clerk"].concat("APP-Finance-Reports")});
  K("rachel.adams","Rachel Adams","10249","Sales|Account Executive","Kevin Nguyen");
  K("bob.turner","Bob Turner","10312","Operations|Dispatcher","Carla Jensen",{groups:ROLES["Operations|Dispatcher"].concat("APP-SAP-AP-Entry","APP-Finance-Reports")});
  K("sam.okafor","Sam Okafor","10271","Sales|Account Executive","Kevin Nguyen",{last:0});
  K("maria.lopez","Maria Lopez","10401","Finance|AP Clerk","Derek Chan",{enabled:false,groups:[],last:null,mfa:false,preHire:true});
  K("ethan.moore","Ethan Moore","10402","Operations|Dispatcher","Carla Jensen",{enabled:false,groups:[],last:null,mfa:false,preHire:true});

  // Filler staff (deterministic)
  let seed=20261005; const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};
  const F=["Adrian","Beatriz","Caleb","Diana","Elijah","Fatima","Gabriel","Hannah","Isaac","Jasmine","Kenji","Leah","Mateo","Naomi","Owen","Priya","Quinn","Rosa","Simon","Tara","Umar","Vanessa","Wesley","Ximena","Yusuf","Zoe","Andre","Bianca","Colin","Daniela","Felix","Grace","Hector","Iris","Julian","Kayla","Luis","Mei","Nathan","Olivia"];
  const L=["Bishop","Castillo","Dawson","Espinoza","Fischer","Gutierrez","Hughes","Ibarra","Jacobs","Kaur","Lindqvist","Mendoza","Nakamura","Ortiz","Pham","Quintero","Reyes","Sullivan","Tran","Underwood","Vargas","Whitaker","Yamamoto","Zamora","Delgado"];
  const plan=[["Operations|Warehouse Associate",40,"Marcus Bell"],["Operations|Dispatcher",18,"Carla Jensen"],["Sales|Account Executive",20,null],["Finance|AP Clerk",6,"Derek Chan"],["HR|HR Generalist",5,"Angela Ruiz"],["IT|Service Desk Tech",5,"Victor Alvarez"],["Operations|Ops Contractor",6,"Carla Jensen (sponsor)"]];
  let i=0, emp=10410;
  plan.forEach(([rk,n,mgr])=>{ for(let k=0;k<n;k++){
    const fn=F[i%F.length], ln=L[(i*7+3)%L.length]; i++;
    let id=(fn+"."+ln).toLowerCase(); if(U[id]) id+=i;
    const x={last:Math.floor(rnd()*30)};
    if(rk.endsWith("Contractor")){x.type="Contractor";x.expiry=20+Math.floor(rnd()*60);}
    K(id,fn+" "+ln,rk.endsWith("Contractor")?"C-"+(2100+k):String(emp++),rk,mgr||(k%2?"Linda Park":"Kevin Nguyen"),x);
  }});
  return U;
}

const HR_FEED = [
  {type:"Hire",who:"Maria Lopez",detail:"AP Clerk, Finance. Manager: Derek Chan. Start date: today.",when:0},
  {type:"Hire",who:"Ethan Moore",detail:"Dispatcher, Operations. Manager: Carla Jensen. Start date: today.",when:0},
  {type:"Rehire",who:"Sofia Ramirez",detail:"Rehired as HR Generalist, HR. Manager: Angela Ruiz. Previously Account Executive, Sales (left Aug 2025).",when:0},
  {type:"Transfer",who:"Tanya Wright",detail:"From Account Executive, Sales to Dispatcher, Operations. New manager: Carla Jensen. Effective today.",when:0},
  {type:"Termination",who:"Robert Hayes",detail:"Involuntary. Effective today, 12:00 PM.",when:0},
  {type:"Leave of absence",who:"Rachel Adams",detail:"Leave begins today. Expected return: Jan 4, 2027.",when:0},
  {type:"Contract end",who:"Dev Patel",detail:"Contract end date on file: "+fmtDay(2)+". Sponsor: Carla Jensen.",when:-1},
  {type:"Termination",who:"Brian Walsh",detail:"Voluntary resignation. Last day: "+fmtDay(-14)+".",when:-14}
];

// ---------- Grading helpers ----------
let S, ui;
const U = id => S.users[id];
const has = (id,g) => U(id).groups.includes(g);
const C = (pass,label,pts,detail="") => ({pass:!!pass,label,pts,detail});
function roleCheck(id,rk,pts){
  const want=ROLES[rk], have=U(id).groups;
  const missing=want.filter(g=>!have.includes(g)), extra=have.filter(g=>!want.includes(g));
  const ok=!missing.length&&!extra.length;
  return C(ok,"Groups match the "+rk.split("|")[1]+" role in the access matrix",pts,
    ok?"":[missing.length?"Missing: "+missing.join(", "):"",extra.length?"Extra: "+extra.join(", "):""].filter(Boolean).join(" · "));
}
const firstIdx = f => S.log.findIndex(f);
function verifiedBefore(tid,acts,target){
  const v=firstIdx(e=>e.ticket===tid&&e.a==="verify");
  const r=firstIdx(e=>acts.includes(e.a)&&e.target===target);
  return v>=0 && (r<0 || v<r);
}
function approvalBefore(tid,test){
  const v=firstIdx(e=>e.ticket===tid&&e.a==="approval");
  const r=firstIdx(test);

function g4Questions(){
  const noTicket=S.log.filter(e=>!e.ticket).length;
  const callerT=new Set(T.filter(t=>t.caller).map(t=>t.id));
  const resets=[];
  S.log.forEach((e,i)=>{
    if(["pwreset","mfareset","unlock"].includes(e.a)&&callerT.has(e.ticket)){
      const key=e.ticket+"|"+e.target+"|"+e.a;
      if(!resets.find(r=>r.key===key)){
        const verified=S.log.slice(0,i).some(x=>x.ticket===e.ticket&&x.a==="verify");
        resets.push({key,label:e.t+" · "+e.ticket+" · "+U(e.target).name+": "+({pwreset:"password reset",mfareset:"MFA reset",unlock:"unlock"}[e.a]),bad:!verified});
      }
    }
  });
  const qs=[{q:"How many account changes in the audit log have no ticket reference?",short:"Changes without a ticket",num:true,correct:noTicket,pts:3}];
  if(resets.length) qs.push({q:"Select every caller-initiated credential change made before the caller's identity was marked verified on that ticket.",multi:true,opts:resets.map(r=>r.label),correct:resets.map((r,i)=>r.bad?i:-1).filter(i=>i>=0)});
  qs.push({q:"You find exceptions in your own work. What's the right move?",short:"Handling your own exceptions",opts:["Fix the log entries so they look right","Report them like any other exception","Leave your own tickets out of the sample"],correct:1,pts:2});
  return qs;
}

    else if(q.num){ const el=document.getElementById(`g-${g.id}-q${i}`); if(el&&el.value!=="") a[i]=parseInt(el.value,10); }
    else if(q.multi){ a[i]=[...document.querySelectorAll(`input[name="g-${g.id}-q${i}"]:checked`)].map(x=>+x.value); }
    else { const el=document.querySelector(`input[name="g-${g.id}-q${i}"]:checked`); if(el) a[i]=+el.value; }

function gGrade(g,gs,a){
  const checks=[];
  if(g.kind==="table") g.rows.forEach((r,i)=>{ const ok=a[i]===r.correct; checks.push(C(ok,r.name+": "+(a[i]==null?"not marked":g.opts[a[i]]),1,ok?(r.why||""):"Correct: "+g.opts[r.correct]+(r.why?". "+r.why:""))); });
  else gQs(g,gs).forEach((q,i)=>{
    if(q.num){ const ok=a[i]===q.correct; checks.push(C(ok,q.short+": you answered "+(a[i]??"nothing"),q.pts,ok?"":"Correct: "+q.correct)); }
    else if(q.multi){ const sel=a[i]||[]; q.opts.forEach((o,j)=>{ const should=q.correct.includes(j), did=sel.includes(j); checks.push(C(should===did,(did?"Selected: ":"Left out: ")+o,1,should===did?"":should?"This should be selected.":"This should not be selected.")); }); }
    else { const ok=a[i]===q.correct; checks.push(C(ok,q.short||q.q,q.pts||2,ok?"":"Correct: "+q.opts[q.correct])); }
  });
  return checks;
}

  const a=gCollect(g,gs), qs=g.kind==="table"?g.rows:gQs(g,gs);
  const missing=qs.some((q,i)=>!q.multi&&a[i]==null);
  if(missing){ toast("Answer every item before submitting"); return; }
  gs.ans=a; gs.checks=gGrade(g,gs,a);
  gs.score=gs.checks.filter(c=>c.pass).reduce((s,c)=>s+c.pts,0); gs.max=gs.checks.reduce((s,c)=>s+c.pts,0);
  save(); render(); scrollTo({top:0});
}
function gTotals(){ let sc=0,mx=0,done=0; G.forEach(g=>{const gs=S.grc[g.id]; if(gs&&gs.checks){sc+=gs.score;mx+=gs.max;done++;}}); return {sc,mx,done,pct:mx?Math.round(sc/mx*100):null}; }

const KEY="pcl-iam-sim-v1";
function fresh(){ return {users:buildUsers(),tickets:Object.fromEntries(T.map(t=>[t.id,{status:"new",esc:[]}])),log:[],active:null,clock:480,grc:{}}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.users&&s.tickets){ s.grc=s.grc||{}; return s; } }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
S=load();
if(S.shift==="thu") buildThu();
const freshUI=()=>({track:"iam",tab:"queue",gtab:"tasks",selT:null,selU:null,selG:null,q:"",dept:"All",sort:"name",confirmReset:false,view:"cur"});
ui=freshUI();

const clockStr=()=>{ const m=S.clock,h=Math.floor(m/60),mm=m%60; return ((h+11)%12+1)+":"+String(mm).padStart(2,"0")+(h<12?" AM":" PM"); };
function logIt(a,target,d){ S.clock+=2; S.log.push({n:S.log.length+1,t:clockStr(),ticket:S.active,a,target,d}); }
const h = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastTimer;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }

// ---------- Actions ----------
function act(a,uid,arg){
  const u=U(uid); let d="";
  switch(a){
    case "enable": u.enabled=true; d="Account enabled"; break;
    case "disable": u.enabled=false; d="Account disabled"; break;
    case "unlock": u.locked=false; d="Account unlocked"; break;
    case "pwreset": u.pwReset=true; d="Temporary password issued, change required at next sign-in"; break;
    case "mfareset": u.mfa=false; u.mfaReset=true; d="MFA methods cleared, re-registration required"; break;
    case "revoke": u.revoked=true; d="All sessions and refresh tokens revoked"; break;
    case "addgrp": if(!arg||u.groups.includes(arg)) return; u.groups.push(arg); d="Added to "+arg; break;
    case "rmgrp": u.groups=u.groups.filter(g=>g!==arg); d="Removed from "+arg; break;
    case "job": { const [dp,ti]=arg.split("|"); u.dept=dp; u.title=ti; d="Job info set to "+dp+" / "+ti; break; }
    case "expiry": { const n=parseInt(arg,10); u.expiry=isNaN(n)||n<=0?null:n; d=u.expiry?"Account expiry set to "+fmtDay(u.expiry):"Account expiry cleared"; break; }
  }
  logIt(a,uid,d); save();
  toast(S.active? d : d+" (no active ticket: change isn't tied to a ticket)");
  render();
}
function tact(a,tid,arg){
  const ts=S.tickets[tid];
  if(a==="start"){ ts.status="working"; S.active=tid; logIt("start",null,"Started work"); }
  if(a==="verify"){ logIt("verify",null,"Caller identity marked verified"); toast("Identity marked verified"); }
  if(a==="approval"){ ts.approval=TK[tid].approval||"No approver is associated with this request."; logIt("approval",null,"Manager approval requested"); }
  if(a==="escalate"){ if(!ts.esc.includes(arg)) ts.esc.push(arg); logIt("escalate",null,"Escalated to "+arg); toast("Escalated to "+arg); }
  if(a==="resume"){ S.active=tid; }
  save(); render();
}
function closeTicket(tid,kind){
  const t=TK[tid], ts=S.tickets[tid];
  ts.note=(document.getElementById("note-"+tid)||{}).value||"";
  const ans=document.getElementById("ans-"+tid); if(ans) ts.answer=ans.value;
  if(t.question && !String(ts.answer||"").trim()){ toast("Enter an answer before closing"); return; }
  S.active=tid; logIt("close",null,kind==="resolve"?"Resolved":"Rejected");
  const checks=t.grade(ts);
  checks.push(C(kind===t.close, t.close==="resolve"?"Closed as resolved":"Closed as rejected (request shouldn't be fulfilled)", 1));
  ts.status=kind==="resolve"?"resolved":"rejected"; ts.checks=checks;
  ts.score=checks.filter(c=>c.pass).reduce((s,c)=>s+c.pts,0); ts.max=checks.reduce((s,c)=>s+c.pts,0);
  S.active=null; save(); render(); window.scrollTo({top:0});
}

// ---------- Rendering ----------
function totals(list){
  list=list||curTickets(); let sc=0,mx=0,done=0;
  list.forEach(t=>{const ts=S.tickets[t.id]; if(ts.checks){sc+=ts.score;mx+=ts.max;done++;}});
  return {sc,mx,done,pct:mx?Math.round(sc/mx*100):null};
}
const statusPill = st => ({new:'<span class="pill">New</span>',working:'<span class="pill acc">In progress</span>',resolved:'<span class="pill ok">Resolved</span>',rejected:'<span class="pill warn">Rejected</span>'}[st]);
const lastTxt = n => n===null?"Never":n===0?"Today":n===1?"Yesterday":n+" days ago";

function userPills(u){
  const p=[];
  if(u.preHire&&!u.enabled) p.push('<span class="pill acc">Pre-hire</span>');
  else if(!u.enabled) p.push('<span class="pill bad">Disabled</span>');
  if(u.locked) p.push('<span class="pill warn">Locked</span>');
  if(u.type!=="Employee") p.push('<span class="pill">'+u.type+'</span>');
  return p.join("");
}

function rQueue(tt){
  const L=curTickets();
  const sorted=L.slice().sort((a,b)=>{const da=S.tickets[a.id].checks?1:0, db=S.tickets[b.id].checks?1:0; return da-db||a.pri-b.pri;});
  let intro="";
  const isThu=L!==T;
  if(S.shift==="thu") intro+=`<div class="viewtoggle" role="group" aria-label="Shift"><button data-view="cur" aria-pressed="${ui.view!=="mon"}">Thursday</button><button data-view="mon" aria-pressed="${ui.view==="mon"}">Monday results</button></div>`;
  if(isThu && S.report){
    const bad=S.report.filter(r=>r.bad), good=S.report.filter(r=>!r.bad);
    intro+=`<div class="panel intro"><h2 style="font-size:18px">What Monday caused</h2><p>${bad.length?bad.length+" of your Monday decisions came back as tickets today.":"Nothing you did Monday came back to bite you."}</p>
      <div class="report">${bad.map(r=>`<div class="rline bad"><span class="mk">✗</span><span>${h(r.text)}</span></div>`).join("")}${good.map(r=>`<div class="rline good"><span class="mk">✓</span><span>${h(r.text)}</span></div>`).join("")}</div></div>`;
  }
  if(tt.done===L.length){
    const msg=tt.pct>=90?"Ready for a real queue.":tt.pct>=75?"Solid shift. Review the checks you missed.":"Rework the tickets you missed, then reset and run the week again.";
    intro+=`<div class="panel intro"><h2 style="font-size:18px">${isThu?"Thursday":"Monday"} complete: ${tt.pct}%</h2><p>${msg}</p>${!isThu&&S.shift!=="thu"?`<p>Your decisions carry forward. Thursday's queue is built from what you did today.</p><div class="btns"><button class="btn primary" data-thursday="1">Start Thursday shift</button></div>`:""}</div>`;
  } else if(tt.done===0 && !S.active && !isThu){
    intro+=`<div class="panel intro"><h2 style="font-size:18px">Monday morning at Pacific Crest Logistics</h2><p>You're the IAM analyst on the service desk. Twenty tickets are waiting. Open one, start work, make the changes in the Directory, then resolve or reject it. Each ticket is graded on the outcome <i>and</i> the process. Check the Policy tab before you guess. Your decisions carry into Thursday's shift.</p></div>`;
  }
  const list=sorted.map(t=>{const ts=S.tickets[t.id]; return `<button class="row" data-ticket="${t.id}" aria-current="${ui.selT===t.id}">
      <span class="pri p${t.pri}">P${t.pri}</span>
      <span><div class="t">${h(t.title)}</div><div class="s">${t.type} · ${h(t.from)}</div></span>
      <span class="pills">${statusPill(ts.status)}${ts.checks?`<span class="pill mono">${ts.score}/${ts.max}</span>`:""}</span></button>`;}).join("");
  return `<div class="stack">${intro}<div class="split ${ui.selT?"show-detail":""}"><div class="list">${list}</div><div class="detail">${ui.selT?rTicket(ui.selT):'<div class="panel empty">Select a ticket to open it.</div>'}</div></div></div>`;
}

function rTicket(id){
  const t=TK[id], ts=S.tickets[id], active=S.active===id, closed=!!ts.checks;
  let s=`<div class="panel"><div class="d-body">
    <button class="back" data-back="queue">← Queue</button>
    <div class="d-head"><div class="inline"><span class="pri p${t.pri}">P${t.pri}</span><span class="mono muted">${t.id}</span>${statusPill(ts.status)}</div>
    <h2>${h(t.title)}</h2>
    <div class="meta"><span>${t.type}</span><span>From: ${h(t.from)}</span><span>Via: ${h(t.channel)}</span><span>Opened ${t.opened}</span></div></div>
    <div class="body-text">${t.body}</div>`;
  if(t.caller) s+=`<div class="callout"><h4>Caller-provided identity details</h4>Employee ID: <span class="mono">${t.caller.empId}</span> · Manager named: ${h(t.caller.mgr)}<div class="muted" style="font-size:12px;margin-top:4px">Policy: compare both against the directory before any credential change.</div></div>`;
  if(t.users.length) s+=`<div class="sec"><h3>Related accounts</h3><div class="btns">${t.users.map(u=>`<button class="btn" data-goto-user="${u}">${h(U(u).name)} ↗</button>`).join("")}</div></div>`;
  if(closed){
    s+=`<div class="sec"><h3>Grade</h3><div class="inline" style="gap:14px;margin-bottom:6px"><span class="scorebig">${ts.score}/${ts.max}</span>${statusPill(ts.status)}</div>
      <div>${ts.checks.map(c=>`<div class="check ${c.pass?"pass":"fail"}"><span class="mk">${c.pass?"✓":"✗"}</span><span>${h(c.label)}${c.detail?`<div class="why">${h(c.detail)}</div>`:""}</span><span class="pts">${c.pass?c.pts:0}/${c.pts}</span></div>`).join("")}</div></div>
      <div class="lesson"><b>Takeaway.</b> ${h(t.lesson)}</div>`;
    if(ts.answer) s+=`<div class="callout"><h4>Your answer</h4>${h(ts.answer)}</div>`;
  } else if(ts.status==="new"){
    s+=`<div class="btns"><button class="btn primary" data-tact="start" data-tid="${id}">Start work</button></div>`;
  } else {
    if(!active) s+=`<div class="callout">Another ticket is active. <button class="btn" data-tact="resume" data-tid="${id}">Make this the active ticket</button></div>`;
    s+=`<div class="sec"><h3>Ticket actions</h3><div class="btns">
      ${t.caller?`<button class="btn" data-tact="verify" data-tid="${id}" ${active?"":"disabled"}>Mark identity verified</button>`:""}
      <button class="btn" data-tact="approval" data-tid="${id}" ${active?"":"disabled"}>Request manager approval</button>
      </div>${ts.approval?`<div class="callout" style="margin-top:8px"><h4>Approval response</h4>${h(ts.approval)}</div>`:""}
      <div class="inline" style="margin-top:8px"><select id="esc-${id}" aria-label="Escalation target"><option>Security team</option><option>Account owner</option><option>Requester's manager</option></select><button class="btn" data-esc="${id}" ${active?"":"disabled"}>Escalate</button>${ts.esc.length?`<span class="muted" style="font-size:12px">Escalated: ${ts.esc.map(h).join(", ")}</span>`:""}</div></div>
      <div class="sec"><h3>Close ticket</h3>
      ${t.question?`<input type="text" id="ans-${id}" placeholder="Answer: usernames or none" style="width:100%;margin-bottom:6px" value="${h(ts.answer||"")}">`:""}
      <textarea id="note-${id}" placeholder="Resolution notes (what you did and why)">${h(ts.note||"")}</textarea>
      <div class="btns" style="margin-top:8px"><button class="btn primary" data-close="resolve" data-tid="${id}">Resolve</button><button class="btn danger" data-close="reject" data-tid="${id}">Reject</button></div></div>`;
  }
  return s+`</div></div>`;
}

  const depts=["All",...new Set(Object.values(S.users).map(u=>u.dept))];
  const q=ui.q.toLowerCase();
  let list=Object.values(S.users).filter(u=>(ui.dept==="All"||u.dept===ui.dept)&&(!q||u.name.toLowerCase().includes(q)||u.id.includes(q)||u.empId.toLowerCase().includes(q)||u.title.toLowerCase().includes(q)));
  if(ui.sort==="last") list.sort((a,b)=>(b.last??-1)-(a.last??-1));
  else if(ui.sort==="status") list.sort((a,b)=>(a.enabled-b.enabled)||(b.locked-a.locked)||a.name.localeCompare(b.name));

function rPolicy(){
  const groups=[...new Set([].concat(...Object.values(ROLES)))].sort();
  const matrix=`<div class="tablewrap"><table><thead><tr><th>Department / title</th><th>Birthright groups</th></tr></thead><tbody>${Object.entries(ROLES).map(([k,g])=>`<tr><td>${k.replace("|"," / ")}</td><td class="mono">${g.join(", ")}</td></tr>`).join("")}</tbody></table></div>`;
  return `<div class="stack">
    <div class="panel intro"><h2 style="font-size:18px">Runbook policies</h2><ol class="policy" style="margin:0;padding-left:20px;max-width:80ch">
      <li><b>Identity verification.</b> Before any password, MFA or unlock action for a caller, confirm their employee ID <i>and</i> manager match the directory. If either doesn't match, don't proceed. Escalate suspected social engineering to Security.</li>
      <li><b>Joiners.</b> Enable the pre-hire account and grant exactly the birthright groups for the role. Never copy another user's access.</li>
      <li><b>Movers.</b> Update job info, remove the old role's groups, grant the new role's groups.</li>
      <li><b>Leavers.</b> Disable, revoke sessions, and remove all group memberships.</li>
      <li><b>Leave of absence.</b> Disable the account. Keep group memberships for the return.</li>
      <li><b>Rehires.</b> Enable, reset the password, remove prior-role access, grant the new role's groups.</li>
      <li><b>Requestable access.</b> ${REQUESTABLE.map(g=>`<span class="mono">${g}</span>`).join(" and ")} may be granted outside the role with documented manager approval.</li>
      <li><b>Separation of duties.</b> Never grant access that creates an SoD conflict below, regardless of approval.</li>
      <li><b>Privileged roles.</b> ROLE-Global-Admin is never assigned by ticket. Privileged access uses PIM just-in-time activation with CAB approval.</li>
      <li><b>Inactive accounts.</b> Disable user accounts with no sign-in for more than 90 days. Pre-hires are excluded. Service accounts are never disabled by the desk; escalate them to the account owner.</li>
      <li><b>Contractors.</b> Accounts must have an expiry date. Extensions require sponsor approval and are capped at 90 days.</li>
      <li><b>Shared accounts.</b> Prohibited. Every person gets a unique ID.</li>
      <li><b>Compromised accounts.</b> Revoke sessions, reset the password, reset MFA, and escalate to Security.</li>
    </ol></div>
    <div class="sec"><h3>Access matrix (role-based)</h3>${matrix}</div>
    <div class="sec"><h3>SoD rules</h3><div class="tablewrap"><table><thead><tr><th>Conflict</th><th>Risk</th></tr></thead><tbody>${SOD.map(([a,b,r])=>`<tr><td class="mono">${a} + ${b}</td><td>${r}</td></tr>`).join("")}</tbody></table></div></div>
  </div>`;
}

function rHR(){
  return `<div class="stack"><div class="muted" style="font-size:12.5px">Workday HR feed. This is the source of truth for joiners, movers and leavers.</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Event</th><th>Worker</th><th>Details</th></tr></thead><tbody>
    ${(S.shift==="thu"?[{type:"Return from leave",who:"Rachel Adams",detail:"Leave ended early. Returns today.",when:3}]:[]).concat(HR_FEED).map(e=>`<tr><td class="mono" style="white-space:nowrap">${fmtDay(e.when)}</td><td><span class="pill ${e.type==="Termination"?"bad":e.type.includes("ire")?"ok":"acc"}">${e.type}</span></td><td>${h(e.who)}</td><td>${h(e.detail)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

function rLog(){
  const rows=S.log.slice().reverse().map(e=>`<tr><td class="mono">${e.t}</td><td class="mono">${e.ticket||'<span style="color:var(--bad)">no ticket</span>'}</td><td>${e.target?`<span class="mono">${h(e.target)}</span>`:"–"}</td><td>${h(e.d)}</td></tr>`).join("");
  return `<div class="stack"><div class="inline" style="justify-content:space-between"><div class="muted" style="font-size:12.5px">Every change is recorded with the ticket it was made under. Auditors sample this.</div>
    ${ui.confirmReset?`<div class="confirm"><span>Reset IAM Ops and GRC progress?</span><button class="btn danger" data-reset="yes">Reset everything</button><button class="btn" data-reset="no">Cancel</button></div>`:`<button class="btn danger" data-reset="ask">Reset all progress</button>`}</div>
    ${S.log.length?`<div class="tablewrap"><table><thead><tr><th>Time</th><th>Ticket</th><th>Account</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="panel empty">No changes yet.</div>'}</div>`;
}

// ---------- GRC rendering ----------
function rGTasks(tt){
  let intro="";
  if(tt.done===G.length){
    const msg=tt.pct>=90?"Workpapers are review-ready.":tt.pct>=75?"Solid fieldwork. Go back over the items you missed.":"Retry the tasks you missed before sign-off.";
    intro=`<div class="panel intro"><h2 style="font-size:18px">Fieldwork complete: ${tt.pct}%</h2><p>${msg}</p></div>`;
  } else if(tt.done===0){
    intro=`<div class="panel intro"><h2 style="font-size:18px">Q3 ITGC fieldwork</h2><p>You're the IT auditor. Test Pacific Crest's access controls, judge what you find, and write it up. Task 4 audits your own IAM Ops shift, so what you did on the desk is now evidence. Control definitions are on the Controls tab.</p></div>`;
  }
  const list=G.map((g,i)=>{const gs=S.grc[g.id]||{}; const lk=g.lock&&g.lock(); return `<button class="row" data-gtask="${g.id}" aria-current="${ui.selG===g.id}">
    <span class="pri">${i+1}</span><span><div class="t">${h(g.title)}</div><div class="s"><span class="mono">${g.ctrl}</span> · ${g.kind==="table"?g.rows.length+" items to test":"Judgment"}</div></span>
    <span class="pills">${gs.checks?`<span class="pill ok">Submitted</span><span class="pill mono">${gs.score}/${gs.max}</span>`:lk?'<span class="pill">Locked</span>':'<span class="pill">Open</span>'}</span></button>`;}).join("");
  return `<div class="stack">${intro}<div class="split ${ui.selG?"show-detail":""}"><div class="list">${list}</div><div class="detail">${ui.selG?rGTask(ui.selG):'<div class="panel empty">Select a task to open it.</div>'}</div></div></div>`;
}
function rGTask(id){
  const g=GK[id], gs=S.grc[id]||(S.grc[id]={}), done=!!gs.checks, lk=g.lock&&g.lock();
  let s=`<div class="panel"><div class="d-body"><button class="back" data-back="grc">← Audit tasks</button>
    <div class="d-head"><div class="inline"><span class="pill acc mono">${g.ctrl}</span>${done?'<span class="pill ok">Submitted</span>':""}</div><h2>${h(g.title)}</h2></div>
    <div class="body-text">${g.intro}</div>`;
  if(g.evidence) s+=`<div class="callout"><h4>Evidence</h4><dl class="kv">${g.evidence.map(([k,v])=>`<dt>${h(k)}</dt><dd>${h(v)}</dd>`).join("")}</dl></div>`;
  if(lk) return s+`<div class="callout">${h(lk)}</div></div></div>`;
  if(done){
    s+=`<div class="sec"><h3>Grade</h3><div class="scorebig" style="margin-bottom:6px">${gs.score}/${gs.max}</div>
      <div>${gs.checks.map(c=>`<div class="check ${c.pass?"pass":"fail"}"><span class="mk">${c.pass?"✓":"✗"}</span><span>${h(c.label)}${c.detail?`<div class="why">${h(c.detail)}</div>`:""}</span><span class="pts">${c.pass?c.pts:0}/${c.pts}</span></div>`).join("")}</div></div>
      <div class="lesson"><b>Takeaway.</b> ${h(g.lesson)}</div>
      <div class="btns"><button class="btn" data-gretry="${id}">Retry this task</button></div>`;
    return s+`</div></div>`;
  }
  const d=gs.draft||{};
  if(g.kind==="table"){
    s+=`<div class="sec"><h3>Test each item</h3><div class="srows">${g.rows.map((r,i)=>`<div class="srow">
      <div class="t">${i+1}. ${h(r.name)} <span class="muted" style="font-weight:400">· ${h(r.sub)}</span></div>
      <dl class="kv">${r.kv.map(([k,v])=>`<dt>${h(k)}</dt><dd${k==="Groups granted"?' class="mono" style="font-size:11.5px"':""}>${h(v)}</dd>`).join("")}</dl>
      <select id="g-${id}-r${i}" data-gdraft="${id}" aria-label="Result for ${h(r.name)}"><option value="">Select result</option>${g.opts.map((o,j)=>`<option value="${j}" ${d[i]===j?"selected":""}>${h(o)}</option>`).join("")}</select></div>`).join("")}</div></div>`;
  } else {
    const qs=gQs(g,gs);
    if(g.dynamic) s+=`<div class="inline"><span class="muted" style="font-size:12px">Evidence snapshot of your log: ${S.log.length} entries.</span><button class="btn" data-grefresh="${id}">Refresh snapshot</button></div>`;
    s+=qs.map((q,i)=>`<fieldset class="q"><legend>${h(q.q)}</legend>${
      q.num?`<input type="number" id="g-${id}-q${i}" data-gdraft="${id}" min="0" style="width:120px" value="${d[i]??""}" aria-label="${h(q.short)}">`
      :q.opts.map((o,j)=>`<label class="opt"><input type="${q.multi?"checkbox":"radio"}" name="g-${id}-q${i}" value="${j}" data-gdraft="${id}" ${(q.multi?(d[i]||[]).includes(j):d[i]===j)?"checked":""}><span>${h(o)}</span></label>`).join("")}</fieldset>`).join("");
  }
  s+=`<div class="btns"><button class="btn primary" data-gsubmit="${id}">Submit workpaper</button></div>`;
  return s+`</div></div>`;
}
function rControls(){
  const C_=[["APD-01","New user provisioning","Access is approved by the user's manager before provisioning and limited to the role's birthright groups.","Per event · Manual · Preventive"],
    ["APD-02","Timely terminations","Accounts are disabled within one business day of the HR termination date.","Per event · Manual · Preventive"],
    ["APD-03","Change authorization","Every account change references an approved ticket. Caller identity is verified before any credential change.","Per event · Manual · Preventive"],
    ["UAR-01","Quarterly access review","Managers certify all directory accounts, including contractors and service accounts, each quarter. Revocations are completed within 5 business days.","Quarterly · Manual · Detective"],
    ["VEN-01","Vendor oversight","SOC reports for critical vendors are reviewed each year, including exceptions, gap coverage, subservice providers and user entity controls.","Annual · Manual · Detective"]];
  return `<div class="stack">
    <div class="tablewrap"><table><thead><tr><th>Control</th><th>Description</th><th>Attributes</th></tr></thead><tbody>${C_.map(c=>`<tr><td><span class="mono">${c[0]}</span><div>${c[1]}</div></td><td>${c[2]}</td><td class="muted">${c[3]}</td></tr>`).join("")}</tbody></table></div>
    <div class="panel intro"><h2 style="font-size:18px">Deficiency levels (SOX)</h2><ul style="margin:0;padding-left:20px;max-width:80ch">
      <li><b>Control deficiency:</b> a control's design or operation doesn't prevent or detect misstatements on a timely basis.</li>
      <li><b>Significant deficiency:</b> less severe than a material weakness, but important enough to merit the attention of those overseeing financial reporting.</li>
      <li><b>Material weakness:</b> a reasonable possibility that a material misstatement won't be prevented or detected on a timely basis.</li></ul>
      <p class="muted" style="font-size:12.5px">Weigh the likelihood and size of a possible misstatement, the systems involved, and whether compensating controls operate.</p></div>
    <div class="panel intro"><h2 style="font-size:18px">Finding format</h2><p><b>Condition</b> (what you found, with numbers) · <b>Criteria</b> (the requirement) · <b>Cause</b> (why it happened) · <b>Effect</b> (the risk or impact) · <b>Recommendation</b> (a fix that addresses the cause).</p></div>
  </div>`;
}

// ---------- Events ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.thursday){ startThursday(); return; }
  if(d.view){ ui.view=d.view; ui.selT=null; render(); return; }
  if(d.track){ ui.track=d.track; ui.confirmReset=false; render(); return; }
  if(d.gtab){ ui.gtab=d.gtab; ui.confirmReset=false; render(); return; }
  if(d.gtask){ ui.selG=d.gtask; render(); if(innerWidth<900) scrollTo({top:0}); return; }
  if(d.gsubmit){ gSubmit(d.gsubmit); return; }
  if(d.gretry){ S.grc[d.gretry]={}; save(); render(); return; }
  if(d.grefresh){ const gs=S.grc[d.grefresh]; delete gs.frozen; delete gs.draft; save(); render(); toast("Snapshot refreshed from your current log"); return; }
  if(d.tab){ ui.tab=d.tab; ui.confirmReset=false; render(); return; }
  if(d.ticket){ ui.selT=d.ticket; render(); if(innerWidth<900) scrollTo({top:0}); return; }
  if(d.openTicket){ ui.tab="queue"; ui.selT=d.openTicket; render(); scrollTo({top:0}); return; }
  if(d.user){ ui.selU=d.user; render(); if(innerWidth<900) scrollTo({top:0}); return; }
  if(d.gotoUser){ ui.tab="dir"; ui.selU=d.gotoUser; render(); scrollTo({top:0}); return; }
  if(d.back){ if(d.back==="queue") ui.selT=null; else if(d.back==="grc") ui.selG=null; else ui.selU=null; render(); return; }
  if(d.tact){ tact(d.tact,d.tid); return; }
  if(d.esc){ tact("escalate",d.esc,document.getElementById("esc-"+d.esc).value); return; }
  if(d.close){ closeTicket(d.tid,d.close); return; }
  if(d.act){ act(d.act,d.uid); return; }
  if(d.rm){ act("rmgrp",d.uid,d.rm); return; }
  if(d.add){ act("addgrp",d.add,document.getElementById("addg").value); return; }
  if(d.job){ act("job",d.job,document.getElementById("job").value); return; }
  if(d.exp){ act("expiry",d.exp,document.getElementById("exp").value); return; }
  if(d.reset){ if(d.reset==="ask") ui.confirmReset=true; else if(d.reset==="no") ui.confirmReset=false; else { S=fresh(); save(); ui=freshUI(); toast("All progress reset"); } render(); return; }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById("q"); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} }
});
document.addEventListener("change",e=>{
  const gid=e.target.dataset&&e.target.dataset.gdraft;
  if(gid){ const gs=S.grc[gid]||(S.grc[gid]={}); gs.draft=gCollect(GK[gid],gs); save(); return; }
  if(e.target.id==="dept"){ ui.dept=e.target.value; render(); }
  if(e.target.id==="sort"){ ui.sort=e.target.value; render(); }
});
render();
})();
</script>
